name: Daily Oracle Elixir Sync

on:
  schedule:
    # Corre todos los días a las 15:00 UTC (las 12:00 del mediodía en Argentina UTC-3)
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña de Actions en GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Sync
        run: |
          python sync_pro_drafts.py --oe-only

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/pro_drafts/pro_drafts.parquet
          git commit -m "🤖 Auto-update pro drafts database from Oracle's Elixir" || exit 0
          git push origin main
